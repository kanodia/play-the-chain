[build-wasm]
canister = "stockfish"
did_path = "src/stockfish.did"
cpp_paths = ["src/*.cpp", "src/sf/*.cpp", "src/sf/syzygy/*.cpp", "src/box2d/collision/*.cpp", "src/box2d/common/*.cpp", "src/box2d/dynamics/*.cpp"]
cpp_include_dirs = ["src/box2d/include"]
cpp_compile_flags = ["-D SF_NO_THREADS", "-D _WASI_EMULATED_MMAN", "-D ICPP_ALLOW_UNBOUNDED_WAIT"]
cpp_link_flags = ["-lwasi-emulated-mman", "-Wl,-z,stack-size=8388608"]
c_paths = []
c_compile_flags = []
[build-native]
cpp_paths = ["native/main.cpp"]
cpp_compile_flags = ["-D SF_NO_THREADS", "-D NDEBUG", "-O3", "-D ICPP_ALLOW_UNBOUNDED_WAIT"]
cpp_link_flags = []
c_paths = []
c_compile_flags = []
